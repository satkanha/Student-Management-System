services:
  - type: web
    name: student-management-system-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: FRONTEND_ORIGINS
        value: https://satkanha.github.io
      - key: DB_SSL
        value: 'true'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: student_management
      - key: DB_SSL_CA
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
